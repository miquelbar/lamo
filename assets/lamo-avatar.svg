<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky & Estate Atmosphere -->
    <linearGradient id="estateSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Garrí Jacket (Velvet Midnight Wool) -->
    <linearGradient id="garriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Calçons amb Bufes (Dark Puffy Breeches) -->
    <linearGradient id="bufesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Calces Blanques de Llana (White Wool Stockings) -->
    <linearGradient id="calcesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Skin Tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#fdba74" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Guiato Hardwood Gradient -->
    <linearGradient id="guiatoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1506" />
      <stop offset="35%" stop-color="#5a2e0e" />
      <stop offset="70%" stop-color="#3d1d08" />
      <stop offset="100%" stop-color="#1e0a02" />
    </linearGradient>

    <!-- Silk Scarf (Mocador de Coll) -->
    <linearGradient id="silkScarf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>

    <clipPath id="circleClipAmo">
      <circle cx="256" cy="256" r="236" />
    </clipPath>
  </defs>

  <!-- Outer Framing -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="242" fill="none" stroke="#0f172a" stroke-width="3" />

  <g clip-path="url(#circleClipAmo)">
    <!-- 1. Sky & Sun -->
    <rect x="0" y="0" width="512" height="512" fill="url(#estateSky)" />
    <circle cx="115" cy="95" r="28" fill="#ffffff" opacity="0.95" />

    <!-- 2. Distant Possessió Estate Hills & Olive Groves -->
    <path d="M 0 250 Q 140 220, 270 238 T 512 225 L 512 512 L 0 512 Z" fill="#ca8a04" opacity="0.8" />
    <ellipse cx="60" cy="210" rx="36" ry="24" fill="#14532d" />
    <ellipse cx="430" cy="205" rx="38" ry="25" fill="#14532d" />
    <ellipse cx="460" cy="200" rx="26" ry="18" fill="#166534" />

    <!-- 3. Estate Ground & Lawn -->
    <path d="M 0 310 Q 180 275, 360 295 T 512 280 L 512 512 L 0 512 Z" fill="#eab308" />
    <path d="M 0 360 L 512 340 L 512 512 L 0 512 Z" fill="#ca8a04" />

    <!-- 4. Mallorcan Possessió Landscape: Centenary Olive Tree & Grazing Sheep in Background -->
    <g id="estate-elements" transform="translate(30, 230)">
      <!-- Dry stone wall (Marge de pedra en sec) -->
      <path d="M 0 68 L 125 58 L 125 78 L 0 88 Z" fill="#78716c" opacity="0.8" stroke="#44403c" stroke-width="0.8" />
      <line x1="30" y1="65" x2="30" y2="85" stroke="#57534e" stroke-width="0.8" />
      <line x1="65" y1="62" x2="65" y2="82" stroke="#57534e" stroke-width="0.8" />
      <line x1="95" y1="60" x2="95" y2="80" stroke="#57534e" stroke-width="0.8" />
      <!-- Ancient Olive Tree Trunk -->
      <path d="M 45 68 C 42 45, 52 35, 46 18 C 56 18, 62 35, 57 68 Z" fill="#3f2e1e" />
      <!-- Olive Tree Foliage -->
      <ellipse cx="48" cy="14" rx="32" ry="18" fill="#15803d" />
      <ellipse cx="32" cy="18" rx="20" ry="14" fill="#166534" />
      <ellipse cx="64" cy="18" rx="22" ry="15" fill="#14532d" />
      <!-- Grazing Mallorcan Sheep -->
      <ellipse cx="106" cy="62" rx="15" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <circle cx="94" cy="58" r="5.5" fill="#e2e8f0" />
      <ellipse cx="91" cy="60" rx="2" ry="3.5" fill="#475569" />
    </g>

    <!-- 5. L'AMO (EL ADMINISTRADOR) FULL HISTORICAL FIGURE -->
    <g id="lamo-full-figure" filter="url(#softShadow)">
      <!-- Sabates de cuiro fi amb sivella (Fine Leather Shoes with Gold Buckles) -->
      <!-- Left Shoe -->
      <path d="M 226 476 L 246 476 Q 256 480, 252 488 L 218 488 Q 218 482, 226 476 Z" fill="#090d16" stroke="#000000" stroke-width="1" />
      <rect x="228" y="478" width="10" height="7" rx="1.5" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
      <!-- Right Shoe -->
      <path d="M 284 476 L 304 476 Q 314 480, 310 488 L 276 488 Q 276 482, 284 476 Z" fill="#090d16" stroke="#000000" stroke-width="1" />
      <rect x="286" y="478" width="10" height="7" rx="1.5" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />

      <!-- Calces Blanques de Llana (Tall White Wool Stockings up to knee) -->
      <rect x="226" y="415" width="22" height="63" rx="4" fill="url(#calcesGrad)" stroke="#cbd5e1" stroke-width="1" />
      <rect x="284" y="415" width="22" height="63" rx="4" fill="url(#calcesGrad)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Knee Garters (Lligacames) with Gold Ribbon Ties -->
      <rect x="224" y="413" width="26" height="5" rx="1" fill="#991b1b" />
      <rect x="282" y="413" width="26" height="5" rx="1" fill="#991b1b" />

      <!-- Calçons amb Bufes (Voluminous Dark Puffy Breeches) -->
      <path d="M 205 345 C 190 380, 195 422, 228 422 C 248 422, 255 395, 266 370 C 278 395, 285 422, 305 422 C 338 422, 342 380, 328 345 Z" 
            fill="url(#bufesGrad)" stroke="#020617" stroke-width="1.5" />
      <path d="M 220 360 Q 212 390, 228 415" stroke="#334155" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M 312 360 Q 320 390, 305 415" stroke="#334155" stroke-width="2" fill="none" opacity="0.6" />

      <!-- El Garrí (Traditional Dark Velvet Short Jacket with Brass Buttons) -->
      <path d="M 214 235 C 208 275, 210 325, 218 350 L 314 350 C 322 325, 324 275, 318 235 Z" 
            fill="url(#garriGrad)" stroke="#0f172a" stroke-width="1.5" />
      <!-- Gold Buttons (Botons d'or del garrí) -->
      <circle cx="266" cy="260" r="3.2" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="266" cy="280" r="3.2" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="266" cy="300" r="3.2" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="266" cy="320" r="3.2" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="266" cy="340" r="3.2" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />

      <!-- Left Sleeve & Arm -->
      <path d="M 214 235 C 196 250, 186 280, 190 310 L 210 314 C 214 285, 218 260, 224 240 Z" fill="url(#garriGrad)" />
      <rect x="188" y="308" width="18" height="6" rx="2" fill="#ffffff" />
      <path d="M 188 314 C 185 330, 186 345, 192 360 L 206 356 C 204 340, 204 326, 206 314 Z" fill="url(#skinGrad)" />

      <!-- Right Sleeve & Arm (Holding the Bastó de Comandament) -->
      <path d="M 318 235 C 338 250, 350 275, 358 300 L 340 312 C 332 290, 324 265, 312 240 Z" fill="url(#garriGrad)" />
      <rect x="340" y="302" width="18" height="6" rx="2" fill="#ffffff" />
      <path d="M 350 306 C 358 322, 362 335, 364 350 L 348 354 C 344 340, 340 328, 338 312 Z" fill="url(#skinGrad)" />

      <!-- Silk Neckerchief / Scarf (Mocador de Coll) -->
      <path d="M 248 220 L 266 255 L 284 220 Z" fill="url(#silkScarf)" stroke="#7f1d1d" stroke-width="1" />
      <circle cx="266" cy="226" r="4" fill="url(#goldGrad)" />
      <path d="M 244 212 L 256 230 L 264 216 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <path d="M 288 212 L 276 230 L 268 216 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

      <!-- Head Base -->
      <ellipse cx="266" cy="186" rx="28" ry="34" fill="url(#skinGrad)" />

      <!-- Dignified Facial Hair & Expression -->
      <path d="M 246 192 C 246 214, 256 226, 266 228 C 276 226, 286 214, 286 192 C 280 202, 272 206, 266 207 C 260 206, 252 202, 246 192 Z" fill="#e2e8f0" opacity="0.75" />
      <path d="M 266 200 C 260 194, 248 196, 242 204 C 252 208, 260 204, 266 201 C 272 204, 280 208, 290 204 C 284 196, 272 194, 266 200 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

      <!-- Dignified Eyes & Brows (Fully visible beneath Montera) -->
      <path d="M 248 174 Q 256 169, 263 174" stroke="#f1f5f9" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M 269 174 Q 276 169, 284 174" stroke="#f1f5f9" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <ellipse cx="255" cy="180" rx="4.5" ry="3.2" fill="#ffffff" />
      <circle cx="255.5" cy="180" r="2.2" fill="#1e293b" />
      <ellipse cx="277" cy="180" rx="4.5" ry="3.2" fill="#ffffff" />
      <circle cx="277.5" cy="180" r="2.2" fill="#1e293b" />

      <!-- Montera Mallorquina (Dignified traditional broad-brimmed felt hat) -->
      <g id="montera-hat">
        <!-- Crown with subtle authentic curve -->
        <path d="M 230 166 C 228 130, 245 112, 266 112 C 287 112, 304 130, 302 166 Z" fill="#090d16" stroke="#000000" stroke-width="1.5" />
        <!-- Wide Sweeping Turned Brim -->
        <path d="M 196 168 C 214 146, 242 150, 266 150 C 290 150, 318 146, 336 168 C 320 176, 212 176, 196 168 Z" 
              fill="#1e293b" stroke="#020617" stroke-width="2" />
        <!-- Cockade / Gold Ribbon Ornament on Hat -->
        <circle cx="266" cy="138" r="4.5" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8" />
        <line x1="266" y1="142" x2="266" y2="152" stroke="#991b1b" stroke-width="2" />
      </g>
    </g>

    <!-- 6. ES GUIATO MALLORQUÍ (Authentic Curved Crook Staff with Bone/Horn Tip) -->
    <g id="es-guiato" filter="url(#softShadow)">
      <!-- Smooth Solid Wood Shaft & Curved Crook (Ganxo del guiato) -->
      <path d="M 360 468 L 360 324 C 360 300, 334 300, 334 322 C 334 332, 344 338, 348 333 C 351 330, 349 324, 344 323 C 343 313, 351 311, 351 324 L 351 468 Z" 
            fill="url(#guiatoGrad)" stroke="#1a0a03" stroke-width="0.8" />
      
      <!-- Polished Wood Highlight along the curve -->
      <path d="M 344 328 C 344 316, 348 306, 355 306 C 361 306, 362 316, 362 326 L 362 466" 
            stroke="#fde68a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.45" />

      <!-- Lower Horn/Bone Ferrule (Virolla de banya i llautó) -->
      <path d="M 359 464 L 367 464 L 365 476 C 365 478, 361 478, 361 476 Z" fill="#fdfbf7" stroke="#94a3b8" stroke-width="0.8" />
      <rect x="359.5" y="463" width="7" height="2" fill="url(#goldGrad)" />
      <ellipse cx="363" cy="477" rx="2.5" ry="1" fill="#0f172a" />

      <!-- Hand firmly gripping the staff below the crook -->
      <g id="staff-hand" transform="translate(351, 340)">
        <rect x="0" y="0" width="18" height="6" rx="3" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="0.6" />
        <rect x="-2" y="7" width="20" height="6.5" rx="3.2" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="0.6" />
        <rect x="-1" y="14" width="19" height="6" rx="3" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="0.6" />
        <rect x="1" y="21" width="16" height="5.5" rx="2.8" fill="url(#skinGrad)" stroke="#c2410c" stroke-width="0.6" />
      </g>
    </g>

    <!-- 7. Bottom Ribbon Banner: L'AMO -->
    <g id="bottom-banner" transform="translate(146, 442)">
      <rect x="0" y="0" width="220" height="46" rx="23" fill="#090d16" stroke="url(#goldGrad)" stroke-width="3" filter="url(#softShadow)" />
      <rect x="4" y="4" width="212" height="38" rx="19" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4" />
      <text x="110" y="31" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="22" 
            font-weight="900" 
            letter-spacing="5" 
            fill="url(#goldGrad)" 
            text-anchor="middle">L'AMO</text>
    </g>
  </g>
</svg>
